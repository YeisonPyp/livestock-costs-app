<nav class="navbar" [class.scrolled]="scrolled">
  <div class="navbar-container">
    <!-- Logo & Brand -->
    <div class="navbar-brand">
      <div class="brand-content">
        <div class="logo">
            <img src="assets/logo.png" alt="Logo Sistema de Costos Ganaderos">
        </div>
        <div class="brand-text">
          <h1 class="brand-title">Ganaderia Veracruz Y.P</h1>
          <p class="brand-subtitle">Gestión de Costos e Inversiones</p>
        </div>
      </div>
    </div>

    <!-- User Menu -->
    <div class="navbar-actions">
      @if (authService.currentUser$ | async; as user) {
        <!-- Notifications (Optional) -->
        <button class="icon-btn notifications-btn" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z" fill="currentColor"/>
          </svg>
          <span class="notification-dot"></span>
        </button>

        <!-- User Dropdown -->
        <div class="user-menu-container">
          <button 
            class="user-menu-trigger" 
            (click)="toggleUserMenu()"
            [attr.aria-expanded]="userMenuOpen"
            aria-label="Menú de usuario"
          >
            <div class="user-avatar">
              <span class="avatar-initials">{{ getInitials(user.full_name) }}</span>
            </div>
            <div class="user-info">
              <span class="user-name">{{ user.full_name }}</span>
              <span class="user-role">{{ getRoleLabel(user.roles[0]) }}</span>
            </div>
            <svg class="dropdown-arrow" [class.open]="userMenuOpen" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div class="user-dropdown" [class.open]="userMenuOpen">
            <div class="dropdown-header">
              <div class="dropdown-avatar">
                <span>{{ getInitials(user.full_name) }}</span>
              </div>
              <div class="dropdown-user-info">
                <p class="dropdown-name">{{ user.full_name }}</p>
                <p class="dropdown-email">{{ user.email || user.username }}</p>
              </div>
            </div>

            <div class="dropdown-divider"></div>

            <div class="dropdown-menu">
              <button class="dropdown-item" (click)="navigateToProfile()">
                <svg class="item-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/>
                </svg>
                <span>Mi Perfil</span>
              </button>

              <button class="dropdown-item" (click)="navigateToSettings()">
                <svg class="item-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/>
                </svg>
                <span>Configuración</span>
              </button>

              <div class="dropdown-divider"></div>

              <button class="dropdown-item danger" (click)="logout()">
                <svg class="item-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" fill="currentColor"/>
                </svg>
                <span>Cerrar Sesión</span>
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Mobile Navigation -->
  <div class="mobile-nav" [class.open]="mobileMenuOpen">
    
  </div>
</nav>
