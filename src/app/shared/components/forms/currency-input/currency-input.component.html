<div class="field" [class.has-error]="hasError" [class.is-disabled]="disabled">
  @if (label) {
    <label class="field-label" [for]="inputId">
      {{ label }}
      @if (required) { <span class="required-mark">*</span> }
    </label>
  }

  <div class="field-wrapper">
    <span class="currency-symbol">{{ currencySymbol }}</span>
    <input
      [id]="inputId"
      type="text"
      inputmode="numeric"
      class="field-input"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [value]="displayValue"
      (input)="onInput($event)"
      (blur)="onBlur()"
      (focus)="onFocus($event)"
    />
  </div>

  <div class="field-footer">
    @if (hasError && errorMessage) {
      <span class="field-error">{{ errorMessage }}</span>
    } @else if (hint) {
      <span class="field-hint">{{ hint }}</span>
    }
  </div>
</div>
