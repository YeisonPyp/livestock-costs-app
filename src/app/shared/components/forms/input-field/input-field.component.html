<div class="field" [class.has-error]="hasError" [class.is-disabled]="disabled">
  @if (label) {
    <label class="field-label" [for]="inputId">
      {{ label }}
      @if (required) { <span class="required-mark">*</span> }
    </label>
  }

  <div class="field-wrapper">
    @if (prefixIcon) {
      <span class="field-icon prefix-icon" [innerHTML]="prefixIcon"></span>
    }
    @if (prefix) {
      <span class="field-prefix">{{ prefix }}</span>
    }

    <input
      [id]="inputId"
      [type]="currentType"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [readonly]="readonly"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onBlur()"
      (focus)="onFocus()"
      class="field-input"
      [class.has-prefix-icon]="prefixIcon"
      [class.has-prefix]="prefix"
      [class.has-suffix]="suffix || suffixIcon || (type === 'password')"
      [attr.autocomplete]="autocomplete"
      [attr.maxlength]="maxLength || null"
      [attr.min]="min ?? null"
      [attr.max]="max ?? null"
      [attr.step]="computedStep"
    />
    <!-- ✅ CAMBIO: [attr.step]="computedStep" en vez de "step || null" -->

    @if (type === 'password') {
      <button type="button" class="field-icon suffix-icon toggle-password" (click)="togglePassword()" tabindex="-1">
        @if (showPassword) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        }
      </button>
    } @else if (suffixIcon) {
      <span class="field-icon suffix-icon" [innerHTML]="suffixIcon"></span>
    } @else if (suffix) {
      <span class="field-suffix">{{ suffix }}</span>
    }
  </div>

  <div class="field-footer">
    @if (hasError && errorMessage) {
      <span class="field-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ errorMessage }}
      </span>
    } @else if (hint) {
      <span class="field-hint">{{ hint }}</span>
    }
    @if (maxLength) {
      <span class="field-counter" [class.near-limit]="value.length > maxLength * 0.8">
        {{ value.length }}/{{ maxLength }}
      </span>
    }
  </div>
</div>
