<div class="shell" [class.sidebar-collapsed]="sidebarCollapsed">
  <!-- Sidebar -->
  <aside class="shell-sidebar" [class.collapsed]="sidebarCollapsed">
    <ng-content select="[sidebar]"></ng-content>
  </aside>

  <!-- Mobile overlay -->
  @if (!sidebarCollapsed && isMobile) {
    <div class="shell-overlay" (click)="collapseSidebar()"></div>
  }

  <!-- Main area -->
  <div class="shell-main">
    <header class="shell-header">
      <button class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <ng-content select="[topbar]"></ng-content>
    </header>

    <main class="shell-content">
      <ng-content></ng-content>
    </main>
  </div>
</div>
