<div class="topbar">
  <!-- Page title / breadcrumb slot -->
  <div class="topbar-start">
    <ng-content select="[topbar-start]"></ng-content>
  </div>

  <!-- Center search (optional) -->
  @if (showSearch) {
    <div class="topbar-search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        type="text"
        class="search-input"
        [placeholder]="searchPlaceholder"
        [(ngModel)]="searchValue"
        (input)="onSearch()"
      />
    </div>
  }

  <!-- Right actions -->
  <div class="topbar-end">
    <ng-content select="[topbar-actions]"></ng-content>

    <!-- Notifications -->
    @if (showNotifications) {
      <button class="icon-btn" (click)="notificationsClick.emit()" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        @if (notificationCount > 0) {
          <span class="notification-dot">{{ notificationCount > 9 ? '9+' : notificationCount }}</span>
        }
      </button>
    }

    <!-- User avatar -->
    @if (showUser) {
      <button class="user-btn" (click)="userClick.emit()" aria-label="Perfil de usuario">
        @if (userAvatar) {
          <img [src]="userAvatar" [alt]="userName" class="user-avatar-img" />
        } @else {
          <span class="user-avatar-initials">{{ initials }}</span>
        }
        @if (!compact) {
          <div class="user-info">
            <span class="user-name">{{ userName }}</span>
            @if (userRole) {
              <span class="user-role">{{ userRole }}</span>
            }
          </div>
        }
      </button>
    }
  </div>
</div>
