<app-page-header
  title="Inversionistas"
  subtitle="Gestión de socios e inversionistas"
>
  <button class="btn btn-primary" (click)="facade.navigateToCreate()">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
    >
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </svg>
    Nuevo Inversionista
  </button>
</app-page-header>

<!-- KPIs -->
<app-investor-stats [stats]="facade.listStats()" />

<!-- Filtros -->
<div class="filters-card">
  <div class="filters-row">
    <div class="search-wrapper">
      <svg
        class="search-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      <input
        type="text"
        class="search-input"
        placeholder="Buscar por nombre o código..."
        [ngModel]="facade.listFilters().search"
        (ngModelChange)="onSearch($event)"
      />
    </div>
    <label class="toggle-label">
      <input
        type="checkbox"
        [ngModel]="facade.listFilters().showInactive"
        (ngModelChange)="facade.updateListFilter({ showInactive: $event })"
      />
      Mostrar inactivos
    </label>
  </div>
</div>

<!-- Estado: cargando -->
@if (facade.listLoading()) {
  <app-loader
    [overlay]="false"
    type="spinner"
    message="Cargando inversionistas..."
  />
}

<!-- Estado: vacío -->
@else if (facade.listItems().length === 0) {
  <app-empty-state
    title="Sin inversionistas"
    message="Registra el primer inversionista del proyecto."
  >
    <button class="btn btn-primary" (click)="facade.navigateToCreate()">
      Nuevo Inversionista
    </button>
  </app-empty-state>
}

<!-- Grid de cards -->
@else {
  <div class="investors-grid">
    @for (inv of facade.listItems(); track inv.id) {
      <app-investor-card
        [investor]="inv"
        (cardClick)="facade.navigateToDetail($event)"
      />
    }
  </div>

  <!-- Paginación -->
  @if (facade.listTotalPages() > 1) {
    <div class="pagination">
      <button
        class="btn btn-sm btn-outline"
        [disabled]="facade.listFilters().page === 1"
        (click)="facade.goToPage(facade.listFilters().page - 1)"
      >
        ← Anterior
      </button>
      <span class="page-info">
        {{ facade.listFilters().page }} / {{ facade.listTotalPages() }}
      </span>
      <button
        class="btn btn-sm btn-outline"
        [disabled]="facade.listFilters().page === facade.listTotalPages()"
        (click)="facade.goToPage(facade.listFilters().page + 1)"
      >
        Siguiente →
      </button>
    </div>
  }
}
