<!-- investor-form.component.html -->

<app-page-header [title]="isEdit() ? 'Editar Inversionista' : 'Nuevo Inversionista'">
  <ng-container breadcrumb>
    <a routerLink="/investments/investors" class="bc-link">Inversionistas</a>
    <span class="bc-sep">/</span>
    <span>{{ isEdit() ? 'Editar' : 'Nuevo' }}</span>
  </ng-container>
</app-page-header>

@if (facade.formLoading()) {
  <app-loader [overlay]="false" type="spinner" message="Cargando..." />
} @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">

    <!-- Persona (solo en creación) -->
    @if (!isEdit()) {
      <app-form-card
        title="Persona"
        subtitle="Vincula el inversionista con una persona registrada en el sistema">
        <app-person-search (personSelected)="onPersonSelected($event)" />
      </app-form-card>
    }

    <!-- Configuración -->
    <app-form-card
      title="Configuración"
      subtitle="Parámetros de vinculación y comportamiento">
      <div class="form-grid">

        <app-input-field
          label="Fecha de Vinculación"
          [required]="true"
          type="date"
          formControlName="joinedDate"
          [control]="f['joinedDate']"
          [max]="today"
          errorMessage="La fecha es requerida"
        />

        <app-select-field
          label="Decisión por Defecto en Ventas"
          formControlName="defaultSaleDecision"
          [options]="defaultDecisionOptions"
          hint="Se aplicará automáticamente si no toma una decisión a tiempo"
        />

        <app-input-field
          label="Porcentaje de Ganancia Inversionista"
          [required]="true"
          type="number"
          formControlName="investorPercentage"
          [control]="f['investorPercentage']"
          placeholder="60"
          [min]="0"
          [max]="100"
          errorMessage="Debe ser un valor entre 0 y 100"
        />

        <app-input-field
          label="Porcentaje de Ganancia Operador"
          type="number"
          formControlName="operatorPercentage"
          [control]="f['operatorPercentage']"
          [disabled]="true"
        />

      </div>

      <div class="toggles-group">
        <app-checkbox-toggle
          label="Inversionista activo"
          description="Los inversionistas inactivos no recibirán notificaciones ni aparecerán en reportes activos"
          mode="toggle"
          formControlName="isActive"
        />
      </div>
    </app-form-card>

    <!-- Notificaciones -->
    <app-form-card
      title="Notificaciones"
      subtitle="Define qué eventos notificar a este inversionista">
      <div class="toggles-group">
        <app-checkbox-toggle
          label="Notificar ventas"
          description="Recibe alertas cuando se registra una venta de ganado que le corresponde"
          mode="toggle"
          formControlName="notifySales"
        />
        <app-checkbox-toggle
          label="Notificar ganancias de peso"
          description="Recibe reportes de evolución de peso del ganado en su propiedad"
          mode="toggle"
          formControlName="notifyWeightGains"
        />
      </div>
    </app-form-card>

    <!-- Notas -->
    <app-form-card title="Notas Internas">
      <div class="field">
        <textarea
          formControlName="notes"
          class="field-textarea"
          rows="4"
          placeholder="Observaciones, acuerdos especiales, condiciones particulares..."
        ></textarea>
      </div>
    </app-form-card>

    <!-- Acciones -->
    <div class="form-actions">
      <a routerLink="/investments/investors" class="btn btn-ghost">Cancelar</a>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || facade.formSaving()">
        @if (facade.formSaving()) {
          <span class="btn-spinner"></span> Guardando...
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          {{ isEdit() ? 'Actualizar' : 'Crear Inversionista' }}
        }
      </button>
    </div>

  </form>
}
