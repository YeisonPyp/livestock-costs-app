<app-page-header [title]="isEdit() ? 'Editar Inversionista' : 'Nuevo Inversionista'">
  <ng-container breadcrumb>
    <a routerLink="/investments/investors" class="bc-link">Inversionistas</a>
    <span class="bc-sep">/</span>
    <span>{{ isEdit() ? 'Editar' : 'Nuevo' }}</span>
  </ng-container>
</app-page-header>

@if (loading()) {
  <app-loader [overlay]="false" type="spinner" message="Cargando..." />
} @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">

    <!-- Persona -->
    <app-form-card
      title="Persona"
      subtitle="Vincula el inversionista con una persona registrada en el sistema"
    >
      <app-alert type="info" [dismissible]="false">
        Ingresa el UUID de la persona. En producción este campo puede ser reemplazado
        por un componente de búsqueda de personas.
      </app-alert>
      <div class="form-row">
        <app-input-field
          label="ID de Persona (UUID) *"
          formControlName="person"
          [control]="f['person']"
          placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
          hint="Identificador único de la persona en el módulo de usuarios"
        ></app-input-field>
      </div>
    </app-form-card>

    <!-- Configuración -->
    <app-form-card title="Configuración" subtitle="Parámetros de vinculación y comportamiento">
      <div class="form-grid">
        <app-input-field
          label="Fecha de Vinculación *"
          type="text"
          formControlName="joined_date"
          [control]="f['joined_date']"
          placeholder="AAAA-MM-DD"
        ></app-input-field>

        <app-select-field
          label="Decisión por Defecto en Ventas"
          formControlName="default_sale_decision"
          [options]="defaultDecisionOptions"
          hint="Se aplicará automáticamente si no toma una decisión a tiempo"
        ></app-select-field>
      </div>

      <div class="toggles-group">
        <app-checkbox-toggle
          label="Inversionista activo"
          description="Los inversionistas inactivos no recibirán notificaciones ni aparecerán en reportes activos"
          mode="toggle"
          formControlName="is_active"
        ></app-checkbox-toggle>
      </div>
    </app-form-card>

    <!-- Notificaciones -->
    <app-form-card title="Notificaciones" subtitle="Define qué eventos notificar a este inversionista">
      <div class="toggles-group">
        <app-checkbox-toggle
          label="Notificar ventas"
          description="Recibe alertas cuando se registra una venta de ganado que le corresponde"
          mode="toggle"
          formControlName="notify_sales"
        ></app-checkbox-toggle>

        <app-checkbox-toggle
          label="Notificar costos"
          description="Recibe alertas cuando se registran costos que afectan su inversión"
          mode="toggle"
          formControlName="notify_costs"
        ></app-checkbox-toggle>

        <app-checkbox-toggle
          label="Notificar ganancias de peso"
          description="Recibe reportes de evolución de peso del ganado en su propiedad"
          mode="toggle"
          formControlName="notify_weight_gains"
        ></app-checkbox-toggle>
      </div>
    </app-form-card>

    <!-- Notas -->
    <app-form-card title="Notas Internas">
      <div class="field">
        <textarea
          formControlName="notes"
          class="field-textarea"
          rows="4"
          placeholder="Observaciones, acuerdos especiales, condiciones particulares..."
        ></textarea>
      </div>
    </app-form-card>

    <!-- Acciones -->
    <div class="form-actions">
      <a routerLink="/investments/investors" class="btn btn-ghost">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving()">
        @if (saving()) {
          <span class="btn-spinner"></span> Guardando...
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
          {{ isEdit() ? 'Actualizar' : 'Crear Inversionista' }}
        }
      </button>
    </div>

  </form>
}
