<section class="kpi-section">
  <div class="kpi-grid">

    <!-- Inversiones Activas -->
    <app-kpi-card
      label="Inversiones Activas"
      [value]="stats.activeCount"
      format="number"
      [decimals]="0"
      [loading]="stats.isLoading"
      color="green"
      icon="trending-up"
    />

    <!-- Inversiones Cerradas -->
    <app-kpi-card
      label="Inversiones Cerradas"
      [value]="stats.closedCount"
      format="number"
      [decimals]="0"
      [loading]="stats.isLoading"
      color="blue"
      icon="package"
    />

    <!-- Total Invertido -->
    <app-kpi-card
      label="Total Invertido"
      [value]="stats.totalInvested"
      format="currency"
      [decimals]="0"
      [loading]="stats.isLoading"
      color="yellow"
      icon="dollar-sign"
    />

    <!-- Capital Actual -->
    <app-kpi-card
      label="Capital Actual"
      [value]="stats.totalCurrentCapital"
      format="currency"
      [decimals]="0"
      [loading]="stats.isLoading"
      color="purple"
      icon="briefcase"
    />

    <!-- Ganancias -->
    <app-kpi-card
      label="Ganancias"
      [value]="stats.totalProfits"
      format="currency"
      [decimals]="0"
      [loading]="stats.isLoading"
      [color]="stats.totalProfits >= 0 ? 'green' : 'red'"
      icon="activity"
    />

    <!-- Costos Totales -->
    <app-kpi-card
      label="Costos Totales"
      [value]="stats.totalCosts"
      format="currency"
      [decimals]="0"
      [loading]="stats.isLoading"
      color="red"
      icon="trending-down"
    />

    <!-- ROI Promedio -->
    <app-kpi-card
      label="ROI Promedio"
      [value]="stats.avgRoi"
      format="percent"
      [decimals]="2"
      [loading]="stats.isLoading"
      [color]="stats.avgRoi >= 0 ? 'green' : 'red'"
      icon="percent"
    />

    <!-- Capital Cerrado -->
    <app-kpi-card
      label="Capital Cerrado"
      [value]="stats.totalClosedCapital"
      format="currency"
      [decimals]="0"
      [loading]="stats.isLoading"
      color="blue"
      icon="layers"
    />

  </div>
</section>
