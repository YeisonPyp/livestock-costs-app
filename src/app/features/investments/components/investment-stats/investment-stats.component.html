<section class="kpi-section">
  <div class="kpi-grid">
    <app-kpi-card
      label="Total Inversiones"
      [value]="stats.total.toString()"
      [loading]="stats.isLoading"
      color="blue"
      [decimals]="0"
    >
      <svg
        icon
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <rect x="2" y="3" width="20" height="14" rx="2" />
        <line x1="8" y1="21" x2="16" y2="21" />
        <line x1="12" y1="17" x2="12" y2="21" />
      </svg>
    </app-kpi-card>

    <app-kpi-card
      label="Activas"
      [value]="(stats.active || 0).toString()"
      [loading]="stats.isLoading"
      color="green"
      [decimals]="0"
    >
      <svg
        icon
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
        <polyline points="16 7 22 7 22 13" />
      </svg>
    </app-kpi-card>

    <app-kpi-card
      label="Capital Total"
      [value]="fmt(stats.totalCapital)"
      [loading]="stats.isLoading"
      color="yellow"
    >
      <svg
        icon
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="12" y1="1" x2="12" y2="23" />
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
      </svg>
    </app-kpi-card>

    <app-kpi-card
      label="Ganancia Neta"
      [value]="fmt(stats.netProfit)"
      [loading]="stats.isLoading"
      [color]="stats.netProfit >= 0 ? 'green' : 'red'"
    >
      <svg
        icon
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 1 0 0 7h5a3.5 3.5 0 1 1 0 7H6" />
      </svg>
    </app-kpi-card>
  </div>
</section>
