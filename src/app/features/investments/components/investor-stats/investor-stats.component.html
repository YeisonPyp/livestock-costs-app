<div class="kpi-grid">
  <app-kpi-card
    label="Total Inversionistas"
    [value]="stats.total.toString()"
    color="blue"
  >
    <svg
      icon
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
      <circle cx="9" cy="7" r="4" />
      <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
      <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    </svg>
  </app-kpi-card>

  <app-kpi-card label="Activos" [value]="stats.active.toString()" color="green">
    <svg
      icon
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <polyline points="20 6 9 17 4 12" />
    </svg>
  </app-kpi-card>

  <app-kpi-card
    label="Capital Total"
    [value]="fmt(stats.totalCapital)"
    color="yellow"
  >
    <svg
      icon
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <line x1="12" y1="1" x2="12" y2="23" />
      <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
    </svg>
  </app-kpi-card>
</div>
