<section class="kpi-section">
  <div class="kpi-grid">

    <!-- Total Ventas -->
    <app-kpi-card
      label="Total Ventas"
      [value]="stats.total"
      format="number"
      [decimals]="0"
      [loading]="stats.isLoading"
      color="blue"
      icon="package"
    />

    <!-- Pendientes -->
    <app-kpi-card
      label="Pendientes"
      [value]="stats.pending"
      format="number"
      [decimals]="0"
      [loading]="stats.isLoading"
      [color]="stats.pending > 0 ? 'yellow' : 'green'"
      icon="clock"
    />

    <!-- Total Cabezas -->
    <app-kpi-card
      label="Total Cabezas"
      [value]="stats.totalHeads"
      format="number"
      [decimals]="0"
      [loading]="stats.isLoading"
      color="purple"
      icon="layers"
    />

    <!-- Monto Neto Total -->
    <app-kpi-card
      label="Monto Neto Total"
      [value]="stats.totalNet"
      format="currency"
      [decimals]="0"
      [loading]="stats.isLoading"
      color="green"
      icon="dollar-sign"
    />

  </div>
</section>
