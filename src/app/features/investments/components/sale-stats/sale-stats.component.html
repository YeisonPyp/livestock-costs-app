<div class="kpi-grid">
  <app-kpi-card
    label="Total Ventas"
    [value]="stats.total.toString()"
    color="blue"
  >
    <svg
      icon
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M12 2L2 7l10 5 10-5-10-5z" />
      <path d="M2 17l10 5 10-5" />
      <path d="M2 12l10 5 10-5" />
    </svg>
  </app-kpi-card>

  <app-kpi-card
    label="Pendientes"
    [value]="stats.pending.toString()"
    [color]="stats.pending > 0 ? 'red' : 'green'"
  >
    <svg
      icon
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="12" cy="12" r="10" />
      <polyline points="12 6 12 12 16 14" />
    </svg>
  </app-kpi-card>

  <app-kpi-card
    label="Monto Neto Total"
    [value]="fmt(stats.totalNet)"
    color="green"
  >
    <svg
      icon
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <line x1="12" y1="1" x2="12" y2="23" />
      <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
    </svg>
  </app-kpi-card>

  <app-kpi-card
    label="Cabezas Vendidas"
    [value]="stats.totalHeads.toString()"
    color="yellow"
  >
    <svg
      icon
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="12" cy="12" r="10" />
    </svg>
  </app-kpi-card>
</div>
