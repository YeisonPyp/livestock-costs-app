<div class="modal-overlay" (click)="cancelled.emit()"></div>
<div class="modal-box">
  <div class="modal-header">
    <h3>Distribuir monto</h3>
    <button class="close-btn" (click)="cancelled.emit()">×</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="modal-body">
    <p class="modal-desc">
      Disponible: <strong>{{ fmt(totalAmount()) }}</strong>
    </p>

    <div class="form-group">
      <label class="form-label required">Monto a Retirar</label>
      <input
        type="number"
        formControlName="withdrawAmount"
        class="form-control"
        min="0"
        [max]="totalAmount()"
        step="0.01"
        placeholder="0.00"
      />
      @if (
        form.get("reinvestAmount")?.invalid &&
        form.get("reinvestAmount")?.touched
      ) {
        <span class="error-text">Monto inválido</span>
      }
    </div>

    <div class="form-group">
      <label class="form-label">Monto a  Reinvertir (automático)</label>
      <input
        type="text"
        formControlName="reinvestAmount"
        class="form-control"
        readonly
      />
    </div>

    @if (sumError) {
      <p class="error-text">La suma debe igualar {{ fmt(totalAmount()) }}</p>
    }

    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" (click)="cancelled.emit()">
        Cancelar
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
        Confirmar
      </button>
    </div>
  </form>
</div>
