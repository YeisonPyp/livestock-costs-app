<app-page-header title="Registro de Costos" subtitle="Controla y analiza todos los gastos de tu operación ganadera">
  <div class="header-actions">
    <!-- Export buttons -->
    <div class="export-group">
      <button class="btn btn-ghost" (click)="exportExcel()" title="Descargar Excel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Excel
      </button>
      <button class="btn btn-ghost" (click)="exportPdf()" title="Descargar PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        PDF
      </button>
    </div>
    <a routerLink="new" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nuevo Costo
    </a>
  </div>
</app-page-header>

<!-- KPIs -->
<div class="kpis-row">
  <app-kpi-card
    label="Total del período"
    [value]="totals()?.total ?? 0"
    format="currency"
    color="blue"
    icon="dollar-sign"
    [loading]="loadingKpis()"
  />
  <app-kpi-card
    label="Registros"
    [value]="totals()?.count ?? 0"
    format="number"
    color="purple"
    icon="activity"
    [loading]="loadingKpis()"
  />
  <app-kpi-card
    label="Promedio por registro"
    [value]="totals()?.average ?? 0"
    format="currency"
    color="green"
    icon="trending-up"
    [loading]="loadingKpis()"
  />
  <app-kpi-card
    label="Mayor gasto"
    [value]="totals()?.max ?? 0"
    format="currency"
    color="yellow"
    icon="zap"
    [loading]="loadingKpis()"
  />
</div>

<!-- Filters -->
<div class="filters-card">
  <div class="filters-row">
    <!-- Search -->
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" placeholder="Buscar por descripción o referencia..."
        [value]="searchTerm" (input)="onSearchChange($any($event.target).value)" />
    </div>

    <!-- Category -->
    <select class="filter-select" [(ngModel)]="categoryFilter" (change)="onFilterChange()">
      <option value="">Todas las categorías</option>
      @for (cat of categories(); track cat.id) {
        <option [value]="cat.id">{{ cat.code }} – {{ cat.name }}</option>
      }
    </select>

    <!-- Date range -->
    <div class="date-range">
      <input type="date" class="filter-input" [(ngModel)]="startDate" (change)="onFilterChange()" placeholder="Desde" />
      <span class="date-sep">→</span>
      <input type="date" class="filter-input" [(ngModel)]="endDate"   (change)="onFilterChange()" placeholder="Hasta" />
    </div>

    @if (hasActiveFilters()) {
      <button class="btn-clear" (click)="clearFilters()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Limpiar
      </button>
    }
  </div>
</div>

<app-table
  [columns]="columns"
  [data]="costs()"
  [config]="tableConfig"
  [loading]="loading()"
  [hasActions]="true"
  [totalItems]="pagination()?.count || 0"
  [totalPages]="pagination()?.total_pages || 1"
  (paginationParamsChange)="onPaginationParamsChange($event)"
>

  <!-- Columna personalizada para acciones -->
  <ng-template #actions let-row>
    <app-dropdown-menu
      [items]="[
        { label: 'Editar', icon: 'edit', routerLink: [row.id, 'edit'] },
        { label: 'Eliminar', icon: 'trash', action: 'delete', danger: true }
      ]"
      (action)="$event === 'delete' && confirmDelete(row)"
    />
  </ng-template>

</app-table>
