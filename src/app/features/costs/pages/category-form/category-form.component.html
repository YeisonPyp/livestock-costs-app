<app-page-header
  [title]="isEdit ? 'Editar Categoría' : 'Nueva Categoría'"
  [subtitle]="isEdit ? 'Modifica los datos de la categoría' : 'Agrega una nueva categoría al árbol de costos'"
  backUrl="/costs/categories">
</app-page-header>

@if (loading()) {
  <app-loader [overlay]="false" type="spinner" message="Cargando..." />
} @else {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

    @if (error()) {
      <app-alert type="danger" [message]="error()" class="mb-4" />
    }

    <!-- Identificación -->
    <app-form-card title="Identificación" icon="tag" class="mb-6">
      <div class="form-grid-3">

        <app-input-field
          label="Código"
          [required]="true"
          formControlName="code"
          placeholder="Ej: 1.2.3"
          hint="Se calcula automáticamente según la jerarquía"
        />

        <app-input-field
          label="Nombre"
          [required]="true"
          formControlName="name"
          placeholder="Ej: Alimentación del ganado"
          class="col-span-2"
        />

      </div>

      <div class="form-grid-2 mt-4">

        <app-select-field
          label="Categoría Padre"
          formControlName="parent"
          [options]="parentOptions"
          placeholder="Sin categoría padre (raíz)"
          hint="El nivel se ajusta automáticamente"
        />

        <div class="field-row">
          <app-input-field
            label="Nivel"
            formControlName="level"
            type="number"
            [readonly]="true"
            hint="Se calcula según el padre"
          />

          <div class="color-field">
            <label class="field-label">Color</label>
            <div class="color-input-wrap">
              <input type="color" formControlName="color" class="color-picker" />
              <span class="color-hex">{{ form.value.color }}</span>
            </div>
          </div>
        </div>

      </div>
    </app-form-card>

    <!-- Descripción -->
    <app-form-card title="Descripción" icon="file-text" class="mb-6">
      <div class="form-group">
        <label class="field-label">Descripción <span class="hint-text">(opcional)</span></label>
        <textarea
          formControlName="description"
          class="textarea"
          [class.error]="hasError('description','maxlength')"
          placeholder="Detalla el propósito o alcance de esta categoría..."
          rows="3"
        ></textarea>
        @if (hasError('description','maxlength')) {
          <span class="error-msg">Máximo 255 caracteres</span>
        }
        <span class="char-count">{{ form.value.description?.length || 0 }} / 255</span>
      </div>
    </app-form-card>

    <!-- Configuración -->
    <app-form-card title="Configuración" icon="settings" class="mb-6">
      <div class="toggles-grid">

        <app-checkbox-toggle
          formControlName="is_movement"
          label="Registra costos"
          description="Permite asociar registros de gasto directamente a esta categoría"
          icon="dollar-sign"
        />

        <app-checkbox-toggle
          formControlName="is_active"
          label="Categoría activa"
          description="Las categorías inactivas no aparecen en los formularios de registro"
          icon="check-circle"
        />

      </div>
    </app-form-card>

    <!-- Actions -->
    <div class="form-footer">
      <a routerLink="/costs/categories" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        @if (saving()) {
          <span class="spinner-sm"></span>
          Guardando...
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          {{ isEdit ? 'Actualizar' : 'Guardar' }} Categoría
        }
      </button>
    </div>

  </form>
}
