<!-- animal-list.component.html -->

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!-- PAGE HEADER                                                              -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->

<app-page-header
  title="Animales"
  subtitle="Inventario completo de tu hato ganadero"
>
  <div class="header-btns">
    <button class="btn btn-outline" (click)="showWeightImport.set(true)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Subir Pesajes
    </button>
    <button class="btn btn-primary" (click)="showBulkImport.set(true)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Carga Masiva
    </button>
  </div>
</app-page-header>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!-- KPIs                                                                     -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->

<div class="kpis-row">
  <app-kpi-card
    label="Total Animales" [value]="kpis().total"
    format="number" color="blue" icon="activity"
    [loading]="loading()" [decimals]="0"
  />
  <app-kpi-card
    label="Machos" [value]="kpis().male"
    format="number" color="purple" icon="user"
    [loading]="loading()" [decimals]="0"
  />
  <app-kpi-card
    label="Hembras" [value]="kpis().female"
    format="number" color="green" icon="user"
    [loading]="loading()" [decimals]="0"
  />
  <app-kpi-card
    label="Peso Promedio" [value]="kpis().avgWeight"
    format="number" color="yellow" icon="trending-up"
    [loading]="loading()" suffix=" kg"
  />
</div>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!-- TABLE (con filtros integrados)                                           -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->

<app-table
  [columns]="columns"
  [data]="animals()"
  [loading]="loading()"
  [hasActions]="true"
  [actionsTemplate]="animalActions"
  [totalItems]="totalCount"
  [serverTotalPages]="totalPages"
  [config]="{
    serverPagination: true,
    searchable: true,
    searchPlaceholder: 'Buscar por arete o nombre...',
    exportable: true,
    exportFormats: ['excel', 'pdf'],
    exportFileName: 'animales',
    showFirstLastPage: true,
    pageSize: 15,
    pageSizeOptions: [10, 15, 25, 50],
    hover: true,
    striped: true,
    showResultCount: true
  }"
  [emptyMessage]="hasActiveFilters
    ? 'No hay animales con los filtros aplicados.'
    : 'Usa la carga masiva para registrar animales.'"
  [emptyIcon]="hasActiveFilters ? 'filter' : 'table'"
  (paginationParamsChange)="onParamsChange($event)"
  (rowClick)="onAnimalClick($event)"
  (exportData)="onExport($event)"
>

  <!-- ── Filtros ──────────────────────────────────────────────────────────── -->
  <ng-container table-filters>
    <select
      class="filter-select"
      [(ngModel)]="statusFilter"
      (ngModelChange)="onFilter()"
    >
      <option value="">Todos los estados</option>
      <option value="active">Activo</option>
      <option value="sold">Vendido</option>
      <option value="dead">Fallecido</option>
      <option value="transferred">Trasladado</option>
    </select>

    <select
      class="filter-select"
      [(ngModel)]="sexFilter"
      (ngModelChange)="onFilter()"
    >
      <option value="">Todos los sexos</option>
      <option value="M">Macho</option>
      <option value="F">Hembra</option>
    </select>

    <select
      class="filter-select"
      [(ngModel)]="breedFilter"
      (ngModelChange)="onFilter()"
    >
      <option value="">Todas las razas</option>
      @for (b of breeds(); track b.id) {
        <option [value]="b.id">{{ b.name }}</option>
      }
    </select>

    <select
      class="filter-select"
      [(ngModel)]="lotFilter"
      (ngModelChange)="onFilter()"
    >
      <option value="">Todos los lotes</option>
      @for (l of lots(); track l.id) {
        <option [value]="l.id">{{ l.name }}</option>
      }
    </select>

    @if (hasActiveFilters) {
      <button class="btn-clear-filters" (click)="clearFilters()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
        Limpiar
      </button>
    }
  </ng-container>

  <!-- ── Botones header (derecha) ─────────────────────────────────────────── -->
  <!-- Vacío: los botones de export ya los maneja app-table internamente.
       Si necesitas más botones aquí, usa este slot. -->

</app-table>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!-- ROW ACTIONS TEMPLATE                                                     -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->

<ng-template #animalActions let-row>
  <app-dropdown-menu
    [items]="[
      { label: 'Ver Detalle', icon: 'eye',  routerLink: [row.id] },
      { label: 'Editar',      icon: 'edit', routerLink: [row.id, 'edit'] }
    ]"
  />
</ng-template>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!-- MODALS                                                                   -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->

@if (showBulkImport()) {
  <app-animal-bulk-import
    (close)="showBulkImport.set(false)"
    (importSuccess)="onImportSuccess($event)"
  />
}

@if (showWeightImport()) {
  <app-weight-bulk-import
    (close)="showWeightImport.set(false)"
    (importSuccess)="onWeightImportSuccess($event)"
  />
}
