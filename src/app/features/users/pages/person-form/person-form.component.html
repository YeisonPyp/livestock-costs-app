<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate autocomplete="off">

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 1 — Tipo de persona
  ══════════════════════════════════════════════════════════════════ -->
  <app-form-card
    title="Tipo de persona"
    subtitle="Selecciona si es una persona natural o jurídica">

    <div class="pf-type-switch">
      <button
        type="button"
        class="pf-type-btn"
        [class.pf-type-btn--active]="isNatural()"
        (click)="form.get('person_type')?.setValue('N')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Persona natural
      </button>

      <button
        type="button"
        class="pf-type-btn"
        [class.pf-type-btn--active]="isJuridical()"
        (click)="form.get('person_type')?.setValue('J')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </svg>
        Persona jurídica
      </button>
    </div>

  </app-form-card>

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 2 — Identificación
  ══════════════════════════════════════════════════════════════════ -->
  <app-form-card
    title="Identificación"
    subtitle="Tipo y número de documento">

    <div class="pf-grid pf-grid--2">

      <app-select-field
        label="Tipo de documento"
        placeholder="Seleccionar tipo"
        [options]="documentTypeOptions()"
        [required]="true"
        [control]="ctrl.document_type"
        [hasError]="!!ctrl.document_type?.invalid && !!ctrl.document_type?.touched"
        [errorMessage]="'Requerido'"
        formControlName="document_type"
      />

      <app-input-field
        label="Número de documento"
        placeholder="Ej: 1234567890"
        [required]="true"
        [maxLength]="20"
        [control]="ctrl.document_number"
        [suffixIcon]="documentSuffixIcon"
        [hint]="checkingDocument() ? 'Verificando disponibilidad...' : ''"
        formControlName="document_number"
      />

    </div>

    <!-- Error de disponibilidad (fuera del componente para no pisar errorMessage interno) -->
    @if (documentAvailable() === false) {
      <p class="pf-async-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Este número de documento ya está registrado.
      </p>
    }

  </app-form-card>

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 3a — Nombres (persona natural)
  ══════════════════════════════════════════════════════════════════ -->
  @if (isNatural()) {
    <app-form-card
      title="Nombres y apellidos"
      subtitle="Ingresa los datos tal como aparecen en el documento">

      <div class="pf-grid pf-grid--2">

        <app-input-field
          label="Primer nombre"
          placeholder="Ej: Juan"
          [required]="true"
          [maxLength]="80"
          [control]="ctrl.first_name"
          formControlName="first_name"
        />

        <app-input-field
          label="Segundo nombre"
          placeholder="Opcional"
          [maxLength]="80"
          [control]="ctrl.second_name"
          formControlName="second_name"
        />

        <app-input-field
          label="Primer apellido"
          placeholder="Ej: Pérez"
          [required]="true"
          [maxLength]="80"
          [control]="ctrl.last_name"
          formControlName="last_name"
        />

        <app-input-field
          label="Segundo apellido"
          placeholder="Opcional"
          [maxLength]="80"
          [control]="ctrl.second_last_name"
          formControlName="second_last_name"
        />

      </div>
    </app-form-card>
  }

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 3b — Razón social (persona jurídica)
  ══════════════════════════════════════════════════════════════════ -->
  @if (isJuridical()) {
    <app-form-card
      title="Razón social"
      subtitle="Nombre legal de la empresa u organización">

      <app-input-field
        label="Nombre legal / razón social"
        placeholder="Ej: Empresa S.A.S."
        [required]="true"
        [maxLength]="200"
        [control]="ctrl.legal_name"
        formControlName="legal_name"
      />

    </app-form-card>
  }

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 4 — Contacto
  ══════════════════════════════════════════════════════════════════ -->
  <app-form-card
    title="Información de contacto"
    subtitle="Datos para comunicarse con la persona">

    <div class="pf-grid pf-grid--2">

      <div class="pf-field-wrap">
        <app-input-field
          label="Correo electrónico"
          placeholder="correo@ejemplo.com"
          type="email"
          [required]="true"
          [control]="ctrl.email"
          [suffixIcon]="emailSuffixIcon"
          [hint]="checkingEmail() ? 'Verificando disponibilidad...' : ''"
          formControlName="email"
        />
        @if (emailAvailable() === false) {
          <p class="pf-async-error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Este correo ya está registrado.
          </p>
        }
      </div>

      <app-input-field
        label="Teléfono"
        placeholder="Ej: +57 300 0000000"
        type="tel"
        [maxLength]="20"
        [control]="ctrl.phone_number"
        formControlName="phone_number"
      />

    </div>
  </app-form-card>

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 5 — Ubicación
  ══════════════════════════════════════════════════════════════════ -->
  <app-form-card
    title="Ubicación"
    subtitle="Dirección y localización geográfica">

    <div class="pf-grid pf-grid--1">
      <app-input-field
        label="Dirección"
        placeholder="Calle, carrera, número..."
        [maxLength]="200"
        [control]="ctrl.address"
        formControlName="address"
      />
    </div>

    <div class="pf-grid pf-grid--3">

      <app-select-field
        label="País"
        placeholder="Seleccionar país"
        [options]="countryOptions()"
        [control]="ctrl.country"
        formControlName="country"
      />

      <app-select-field
        label="Departamento / Estado"
        [placeholder]="loadingStates() ? 'Cargando...' : 'Seleccionar'"
        [options]="stateOptions()"
        [disabled]="!form.get('country')?.value || loadingStates()"
        [control]="ctrl.state"
        formControlName="state"
      />

      <app-select-field
        label="Ciudad"
        [placeholder]="loadingCities() ? 'Cargando...' : 'Seleccionar'"
        [options]="cityOptions()"
        [disabled]="!form.get('state')?.value || loadingCities()"
        [control]="ctrl.city"
        formControlName="city"
      />

    </div>
  </app-form-card>

  <!-- ══════════════════════════════════════════════════════════════════
       CARD 6 — Información adicional (solo persona natural)
  ══════════════════════════════════════════════════════════════════ -->
  @if (isNatural()) {
    <app-form-card
      title="Información adicional"
      subtitle="Datos complementarios del registro">

      <div class="pf-grid pf-grid--2">

        <app-select-field
          label="Género"
          placeholder="Sin especificar"
          [options]="genderOptions()"
          [control]="ctrl.gender"
          formControlName="gender"
        />

        <app-input-field
          label="Fecha de nacimiento"
          placeholder="DD/MM/AAAA"
          type="date"
          [control]="ctrl.birth_date"
          formControlName="birth_date"
        />

      </div>

    </app-form-card>
  }

  <!-- ══════════════════════════════════════════════════════════════════
       ACTIONS
  ══════════════════════════════════════════════════════════════════ -->
  <div class="pf-actions">
    <button
      type="button"
      class="pf-btn pf-btn--ghost"
      (click)="onCancel()"
      [disabled]="submitting()">
      Cancelar
    </button>

    <button
      type="submit"
      class="pf-btn pf-btn--primary"
      [disabled]="form.invalid || submitting() || loading()">
      @if (submitting() || loading()) {
        <span class="pf-spinner"></span>
      }
      {{ submitLabel }}
    </button>
  </div>

</form>
